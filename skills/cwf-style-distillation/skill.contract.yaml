name: cwf-style-distillation
version: 0.1.1
kind: prompt
scope: direct/manual
inputs: [source_materials, author_or_person, genre, purpose, authorization_scope]
outputs: [style_profile, style_card, evidence_scope, limitations, versioned_library_entry]
